{% extends 'base.html' %}

{% block content %}
<h2>Add Plan</h2>
<form method="post">
    <label>Plan Name<input type="text" name="plan_name" required></label>
    <label>Duration (Months)<input type="number" name="duration_months" min="1" required></label>
    <label>Fee<input type="number" name="fee" min="0" step="0.01" required></label>
    <button type="submit">Save Plan</button>
</form>
{% endblock %}
