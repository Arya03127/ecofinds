{% extends "base.html" %}
{% block title %}{% if student %}Edit Student{% else %}Add Student{% endif %} — HostelMS{% endblock %}

{% block content %}
<h2>{% if student %}Edit Student{% else %}Add Student{% endif %}</h2>

<div class="card shadow-sm mt-3" style="max-width:540px">
  <div class="card-body">
    <form method="post">
      <div class="row g-2 mb-3">
        <div class="col">
          <label class="form-label">Roll Number *</label>
          <input type="text" name="roll_number" class="form-control"
                 value="{{ student.roll_number if student else '' }}" required maxlength="20">
        </div>
        <div class="col">
          <label class="form-label">Full Name *</label>
          <input type="text" name="name" class="form-control"
                 value="{{ student.name if student else '' }}" required maxlength="100">
        </div>
      </div>
      <div class="mb-3">
        <label class="form-label">Email *</label>
        <input type="email" name="email" class="form-control"
               value="{{ student.email if student else '' }}" required>
      </div>
      <div class="row g-2 mb-3">
        <div class="col">
          <label class="form-label">Phone</label>
          <input type="text" name="phone" class="form-control"
                 value="{{ student.phone if student else '' }}" maxlength="15">
        </div>
        <div class="col">
          <label class="form-label">Gender *</label>
          <select name="gender" class="form-select" required>
            {% for g in ['Male','Female','Other'] %}
            <option value="{{ g }}"
                    {% if student and student.gender==g %}selected{% endif %}>{{ g }}</option>
            {% endfor %}
          </select>
        </div>
      </div>
      <div class="row g-2 mb-3">
        <div class="col">
          <label class="form-label">Department *</label>
          <input type="text" name="department" class="form-control"
                 value="{{ student.department if student else '' }}" required maxlength="60">
        </div>
        <div class="col">
          <label class="form-label">Year *</label>
          <select name="year" class="form-select" required>
            {% for y in range(1, 6) %}
            <option value="{{ y }}"
                    {% if student and student.year==y %}selected{% endif %}>Year {{ y }}</option>
            {% endfor %}
          </select>
        </div>
      </div>
      <div class="d-flex gap-2">
        <button type="submit" class="btn btn-info text-white">
          <i class="bi bi-check-lg"></i> Save
        </button>
        <a href="{{ url_for('students') }}" class="btn btn-secondary">Cancel</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
