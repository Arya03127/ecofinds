{% extends "base.html" %}
{% block title %}{% if hostel %}Edit Hostel{% else %}Add Hostel{% endif %} — HostelMS{% endblock %}

{% block content %}
<h2>{% if hostel %}Edit Hostel{% else %}Add Hostel{% endif %}</h2>

<div class="card shadow-sm mt-3" style="max-width:520px">
  <div class="card-body">
    <form method="post">
      <div class="mb-3">
        <label class="form-label">Hostel Name *</label>
        <input type="text" name="name" class="form-control"
               value="{{ hostel.name if hostel else '' }}" required maxlength="100">
      </div>
      <div class="mb-3">
        <label class="form-label">Type *</label>
        <select name="type" class="form-select" required>
          {% for t in ['Boys','Girls','Co-ed'] %}
          <option value="{{ t }}" {% if hostel and hostel.type==t %}selected{% endif %}>{{ t }}</option>
          {% endfor %}
        </select>
      </div>
      <div class="mb-3">
        <label class="form-label">Warden Name *</label>
        <input type="text" name="warden_name" class="form-control"
               value="{{ hostel.warden_name if hostel else '' }}" required maxlength="100">
      </div>
      <div class="mb-3">
        <label class="form-label">Contact</label>
        <input type="text" name="contact" class="form-control"
               value="{{ hostel.contact if hostel else '' }}" maxlength="20">
      </div>
      <div class="d-flex gap-2">
        <button type="submit" class="btn btn-success">
          <i class="bi bi-check-lg"></i> Save
        </button>
        <a href="{{ url_for('hostels') }}" class="btn btn-secondary">Cancel</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
