{% extends 'base.html' %}

{% block content %}
<h2>Plans</h2>
<a class="button" href="{{ url_for('add_plan') }}">Add Plan</a>
<table>
    <thead>
        <tr>
            <th>ID</th>
            <th>Plan Name</th>
            <th>Duration (Months)</th>
            <th>Fee</th>
        </tr>
    </thead>
    <tbody>
    {% for plan in plans %}
        <tr>
            <td>{{ plan.id }}</td>
            <td>{{ plan.plan_name }}</td>
            <td>{{ plan.duration_months }}</td>
            <td>{{ plan.fee }}</td>
        </tr>
    {% else %}
        <tr><td colspan="4">No plans found.</td></tr>
    {% endfor %}
    </tbody>
</table>
{% endblock %}
